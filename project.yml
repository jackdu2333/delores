name: Tinycast
options:
  bundleIdPrefix: com.jackdu.delores
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.2.2"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    # Reuse the verified local identity so macOS keeps the Accessibility grant across rebuilds.
    # A Delores-specific identity can replace it without changing the source boundary.
    CODE_SIGN_IDENTITY: "HuaciGongju CodeSign"
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Release:
      # Release-only: library validation refuses Debug's `.debug.dylib`, whose team never matches.
      ENABLE_HARDENED_RUNTIME: YES
      # Strip the shipped binary (dSYM is still generated first) and drop unused code.
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_SWIFT_SYMBOLS: YES
      DEAD_CODE_STRIPPING: YES

targets:
  Tinycast:
    type: application
    platform: macOS
    sources:
      - path: Tinycast
      # The MIT mark's licence asks the notice to travel with the binary, not just the repo.
      - path: NOTICE.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Delores
        PRODUCT_BUNDLE_IDENTIFIER: com.jackdu.delores
        INFOPLIST_FILE: Tinycast/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tinycast/Tinycast.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: tinycast
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        # Debug is its own channel: a distinct bundle id means a
        # locally-run build gets its own prefs, caches, TCC grants and login item instead of
        # inheriting — and corrupting — the installed app's state.
        Debug:
          PRODUCT_NAME: Delores Dev
          PRODUCT_BUNDLE_IDENTIFIER: com.jackdu.delores.dev

schemes:
  Delores:
    build:
      targets:
        Tinycast: all
    run:
      config: Debug
    archive:
      config: Release
