name: Feature Request
description: Suggest an idea
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: <sub>Delores currently targets macOS 26+.</sub>
  - type: textarea
    id: what
    attributes:
      label: What should it do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it belong in Delores?
      description: >
        Delores is one product with one shared core and three surfaces: Command, Context and
        Companion. The Command Surface builds on Tinycast's launcher and search foundation. Explain
        which surface this belongs to and why it is worth its weight.
    validations:
      required: true
  - type: checkboxes
    id: willing
    attributes:
      label: Contribution
      description: >
        **Ticking this is not permission to start.** Wait until a maintainer labels this issue
        `approved` — that label is the only green light. A pull request whose linked issue isn't
        `approved` is closed automatically, unreviewed. Docs-only changes are the exception. Read
        [CONTRIBUTING.md](https://github.com/jackdu2333/delores/blob/main/CONTRIBUTING.md)
        first — it is required reading, and it is what your PR is held to.
      options:
        - label: I'm willing to implement this myself **once this issue is labelled `approved`**
          required: false
