name: CI

# The job is a merge gate. There is no xcodebuild step: the full Debug build costs minutes and the
# release workflow already builds before it ships, so CI keeps to the two checks that finish in about
# a minute. Both go through the scripts rather than naming rules or harnesses here, so this file
# cannot drift from them. See docs/testing.md.
#
# A push to the default branch and a PR both run it.
#
# It used to be PRs only, on the reasoning that `pull_request` builds the *merge result* and that a
# direct push would be covered the next time a PR opened. That does not hold for this repository:
# `integration/delores` is the default branch and is developed by pushing straight to it, so the ref
# CI exists to protect was the one ref it never saw. A push to it now runs the same job — the evidence
# per HEAD the branch was missing. A PR targeting it runs both, which costs one duplicated minute and
# is cheaper than a condition that has to stay correct.
on:
  pull_request:
  push:
    branches: [integration/delores]
  workflow_dispatch:

# A new push supersedes the previous run for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 26.x found on this runner. Installed Xcodes:"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "Using $XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      - name: Run the harnesses
        run: ./Scripts/run-tests.sh

      - name: Run the Delores context harness
        run: ./Scripts/run-delores-tests.sh

      - name: Run the upstream drift regression
        run: ./Tests/upstream-drift-test.sh

      - name: Run the vendored Huaci harness
        run: |
          # The vendored snapshot uses `NSGlassEffectView.effectIsInteractive`, a macOS 27 member
          # behind `if #available(macOS 27.0, *)`. Availability gates the *runtime*, not the compile:
          # against an earlier SDK the member does not exist at all and the build fails, which is what
          # this runner has. So the harness runs where the SDK can build it, and says so where it
          # cannot, instead of failing every run for a reason nobody can fix. It starts running again
          # on its own the day the runner's SDK moves — nothing to remember.
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          if [ "${sdk%%.*}" -lt 27 ]; then
            echo "Skipped: vendored Huaci needs the macOS 27 SDK; this runner has $sdk."
            exit 0
          fi
          ./Scripts/run-huaci-integration-tests.sh

      # `if: always()` so a failing harness still surfaces the lint annotations in the same run.
      # Warnings annotate the diff; only lint *errors* fail the job, matching a local run.
      - name: Lint
        if: always()
        env:
          SWIFTLINT_REPORTER: github-actions-logging
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          ./Scripts/lint.sh
